
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="header">
        <h1>🚚 Ship Calculator</h1>
        <p>Tính thu nhập shipper</p>
    </header>

    <section class="card">

        <div class="input-group">
            <label>💰 Doanh thu</label>
            <input
                type="number"
                id="revenue"
                placeholder="0">
        </div>

        <div class="input-group">
            <label>⛽ Tiền xăng</label>
            <input
                type="number"
                id="fuel"
                placeholder="0">
        </div>

        <div class="input-group">
            <label>🛠 Chi phí khác</label>
            <input
                type="number"
                id="other"
                placeholder="0">
        </div>

        <button id="calculateBtn">
            TÍNH THU NHẬP
        </button>

    </section>

    <section class="result-card">

        <h2>Kết quả</h2>

        <div class="result-row">
            <span>Doanh thu</span>
            <strong id="showRevenue">0 ₫</strong>
        </div>

        <div class="result-row">
            <span>Tổng chi phí</span>
            <strong id="showExpense">0 ₫</strong>
        </div>

        <div class="result-row total">
            <span>Thu nhập</span>
            <strong id="showProfit">0 ₫</strong>
        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
